[project]
name = "CoSMIC-Auth"
version = "1.0.0"
description = "Cognitive System of Machine Intelligent Computing (authentication service)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.129.0",
    # NOTE: Use 'psycopg[binary]' version on production.
    "psycopg>=3.3.3",
    "sqlmodel>=0.0.37",
    "authlib>=1.8.0",
    "httpx2>=2.13.1",
    # NOTE: Required by Starlette's SessionMiddleware, which Authlib uses to
    # keep the temporary OAuth state/nonce.
    "itsdangerous>=2.2.0",
    # NOTE: Used to detect near-miss (e.g. L337) immutable field value mimicry.
    "rapidfuzz>=3.14.5",
]


[dependency-groups]
dev = [
    "faker>=37.0.0",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
