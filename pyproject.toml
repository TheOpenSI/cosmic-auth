[project]
name = "cosmic-auth"
version = "1.0.0"
description = "Cognitive System of Machine Intelligent Computing (auth micro-service)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.129.0",
    # NOTE: Use 'psycopg[binary]' version on production.
    "psycopg>=3.3.3",
    "sqlmodel>=0.0.37",
    "authlib>=1.8.0",
    "httpx2>=2.13.1",
    # NOTE: Required by Starlette's SessionMiddleware, which Authlib uses to
    # keep the temporary OAuth state/nonce.
    "itsdangerous>=2.2.0",
    # NOTE: Imported directly by utils/keys.py and utils/session.py to sign and
    # verify the RS256 session cookie.
    "joserfc>=1.7.5",
    # NOTE: Imported directly by cores/configs.py to read the env files.
    "python-dotenv>=1.2.2",
]
